<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Presensi Guru - Malika Boarding School</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 30px;
    }
    .app-header {
      background: linear-gradient(135deg, #1f4e79, #2f5597);
      color: white;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      padding: 20px 15px;
    }
    .card-custom {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .camera-container {
      background-color: #000;
      border: 3px solid #1f4e79;
      border-radius: 16px;
      overflow: hidden;
      min-height: 250px;
      position: relative;
    }
    #reader {
      width: 100%;
      border: none !important;
    }
    .preview-photo {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
    }
    .btn-primary-custom {
      background: linear-gradient(135deg, #1f4e79, #2f5597);
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- APP HEADER -->
  <div class="app-header text-center mb-3">
    <h5 class="fw-bold mb-1"><i class="fa-solid fa-qrcode me-2"></i>Presensi KBM Guru</h5>
    <small class="opacity-75">SMP SMA Malika Boarding School</small>
  </div>

  <div class="container px-3">

    <div class="card card-custom p-3 mb-3">
      
      <!-- STEP 1: PILIH GURU -->
      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary small"><i class="fa-solid fa-user me-1"></i> Identitas Guru</label>
        <select id="selectGuru" class="form-select form-select-lg fs-6" onchange="saveSelectedGuru()">
          <option value="">-- Memuat Data Guru... --</option>
        </select>
      </div>

      <!-- STEP 2: AREA KAMERA SCANNER QR -->
      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary small"><i class="fa-solid fa-camera me-1"></i> Area Kamera QR Kelas</label>
        
        <div class="camera-container shadow-sm mb-2">
          <div id="reader"></div>
        </div>

        <!-- FALLBACK UPLOAD FILE -->
        <div class="text-center">
          <span class="text-muted small d-block mb-1">Bermasalah dengan kamera? Scan via foto:</span>
          <input type="file" id="qrFileInput" accept="image/*" capture="environment" class="d-none" onchange="scanQRFromFile(event)">
          <button type="button" class="btn btn-outline-secondary btn-sm w-100 fw-semibold" onclick="document.getElementById('qrFileInput').click()">
            <i class="fa-solid fa-file-image me-1"></i> Upload / Foto QR Code
          </button>
        </div>
      </div>

      <!-- RESULT MATCHING JADWAL -->
      <div id="scanResultCard" class="alert alert-info d-none p-3 mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="badge bg-primary fs-6" id="resKelas">Kelas -</span>
          <span class="badge bg-dark" id="resJamKe">Jam -</span>
        </div>
        <div class="fw-bold text-dark mb-1" id="resMapel">Mata Pelajaran</div>
        <small class="text-muted d-block" id="resWaktu"><i class="fa-solid fa-clock me-1"></i>-</small>
      </div>

      <!-- STEP 3: FOTO SELFIE BUKTI KBM -->
      <div class="mb-3">
        <label class="form-label fw-semibold text-secondary small"><i class="fa-solid fa-image me-1"></i> Foto Bukti Mengajar / Selfie</label>
        <input type="file" id="inputCamera" accept="image/*" capture="environment" class="form-control d-none" onchange="previewCapturedPhoto(event)">
        
        <button type="button" class="btn btn-light border w-100 py-2 text-secondary fw-medium mb-2" onclick="document.getElementById('inputCamera').click()">
          <i class="fa-solid fa-camera-retro me-2 text-primary"></i> Ambil Foto Selfie / Kelas
        </button>

        <img id="photoPreview" class="preview-photo d-none mt-2" alt="Preview Foto">
      </div>

      <!-- SUBMIT BUTTON -->
      <button id="btnSubmit" class="btn btn-primary-custom text-white w-100 py-3 mt-2 shadow-sm" onclick="submitDataAbsen()" disabled>
        <i class="fa-solid fa-paper-plane me-2"></i> Kirim Presensi Kehadiran
      </button>

    </div>

    <!-- STATUS FOOTER -->
    <div class="text-center text-muted small">
      <i class="fa-solid fa-shield-halved me-1"></i> Terhubung ke Google Apps Script Backend
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // URL WEB APP GAS ANDA
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwL-xC2yRyFC6jzPPVpsNP6skVFXDvH9WMX1m2B3MNj_nySirmQGaqZWpXf0J4-SOadWA/exec";

    let html5QrcodeScanner = null;
    let scannedData = null;
    let capturedBase64 = "";

    document.addEventListener("DOMContentLoaded", function() {
      loadMasterGuru();
      initScannerBox();
    });

    function fetchAPI(data, callback) {
      fetch(GAS_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(res => callback(res))
      .catch(err => {
        alert("Gagal terhubung ke server: " + err);
      });
    }

    function loadMasterGuru() {
      fetchAPI({ action: "getMasterGuru" }, function(res) {
        const select = document.getElementById("selectGuru");
        select.innerHTML = '<option value="">-- Pilih Nama Guru --</option>';
        
        if (res.success && res.data) {
          res.data.forEach(g => {
            const opt = document.createElement("option");
            opt.value = g.kode;
            opt.text = `${g.nama} (${g.kode})`;
            select.appendChild(opt);
          });
        }

        const savedGuru = localStorage.getItem("SAVED_KODE_GURU");
        if (savedGuru) {
          select.value = savedGuru;
        }
      });
    }

    function saveSelectedGuru() {
      const kodeGuru = document.getElementById("selectGuru").value;
      if (kodeGuru) {
        localStorage.setItem("SAVED_KODE_GURU", kodeGuru);
      }
      checkValidToSubmit();
    }

    function initScannerBox() {
      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        { 
          fps: 10, 
          qrbox: { width: 220, height: 220 },
          rememberLastUsedCamera: true
        },
        false
      );

      html5QrcodeScanner.render(onScanSuccess, onScanError);
    }

    function scanQRFromFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const html5QrCode = new Html5Qrcode("reader");
      html5QrCode.scanFile(file, true)
        .then(qrCodeText => {
          onScanSuccess(qrCodeText);
        })
        .catch(err => {
          alert("❌ QR Code tidak terdeteksi pada gambar.");
        });
    }

    function onScanSuccess(qrCodeText) {
      const kodeGuru = document.getElementById("selectGuru").value;

      fetchAPI({
        action: "processQR",
        qrCodeText: qrCodeText,
        kodeGuru: kodeGuru
      }, function(res) {
        if (!res.success) {
          alert(res.message);
          return;
        }

        scannedData = res;
        
        document.getElementById("scanResultCard").classList.remove("d-none");
        document.getElementById("resKelas").innerText = res.kelas.nama;
        
        if (res.jadwal) {
          document.getElementById("resJamKe").innerText = "Jam Ke-" + res.jadwal.jamKe;
          document.getElementById("resMapel").innerText = res.jadwal.namaMapel + " (" + res.jadwal.kodeMapel + ")";
          document.getElementById("resWaktu").innerText = `Alokasi Waktu: ${res.jadwal.alokasiWaktu}`;
        } else {
          document.getElementById("resJamKe").innerText = "Di Luar Jam";
          document.getElementById("resMapel").innerText = "Mapel Bebas / Tidak Terjadwal";
          document.getElementById("resWaktu").innerText = `Jam Sekarang: ${res.jamSekarang}`;
        }

        if (html5QrcodeScanner) {
          html5QrcodeScanner.clear();
        }

        checkValidToSubmit();
      });
    }

    function onScanError(errorMessage) {}

    function previewCapturedPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          capturedBase64 = e.target.result;
          const img = document.getElementById("photoPreview");
          img.src = capturedBase64;
          img.classList.remove("d-none");
          checkValidToSubmit();
        };
        reader.readAsDataURL(file);
      }
    }

    function checkValidToSubmit() {
      const kodeGuru = document.getElementById("selectGuru").value;
      const isValid = kodeGuru !== "" && scannedData !== null;
      document.getElementById("btnSubmit").disabled = !isValid;
    }

    function submitDataAbsen() {
      const kodeGuru = document.getElementById("selectGuru").value;
      const btn = document.getElementById("btnSubmit");
      
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Mengirim data...';

      const payloadData = {
        kodeGuru: kodeGuru,
        kodeKelas: scannedData.kelas.kode,
        kodeMapel: scannedData.jadwal ? scannedData.jadwal.kodeMapel : "UMUM",
        jamKe: scannedData.jadwal ? scannedData.jadwal.jamKe : "-",
        fotoBase64: capturedBase64
      };

      fetchAPI({
        action: "submitAbsen",
        payload: payloadData
      }, function(res) {
        if (res.success) {
          alert("✅ Presensi Kehadiran Berhasil Diisi!");
          location.reload();
        } else {
          alert("❌ " + res.message);
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> Kirim Presensi Kehadiran';
        }
      });
    }
  </script>
</body>
</html>
