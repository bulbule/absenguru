<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi KBM Guru - Malika Boarding School</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 40px;
    }
    .card-form {
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    .btn-submit {
      background-color: #0f172a;
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 10px;
    }
    .btn-submit:hover {
      background-color: #1e293b;
    }
    .loading-spinner {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container py-4" style="max-width: 500px;">
    
    <!-- HEADER -->
    <div class="text-center mb-4">
      <h4 class="fw-bold text-dark mb-1">PRESENSI KBM GURU</h4>
      <p class="text-muted small">SMP & SMA Malika Boarding School</p>
    </div>

    <!-- CARD FORM -->
    <div class="card card-form p-4 bg-white">
      <form id="formAbsen">
        
        <!-- NAMA GURU (DROPDOWN AUTOMATIS DARI SHEET) -->
        <div class="mb-3">
          <label for="nama_guru" class="form-label fw-semibold">Nama Guru <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user-tie"></i></span>
            <select class="form-select" id="nama_guru" name="nama_guru" required>
              <option value="">-- Memuat Daftar Guru... --</option>
            </select>
          </div>
        </div>

        <!-- KELAS -->
        <div class="mb-3">
          <label for="kode_kelas" class="form-label fw-semibold">Kelas / Ruangan <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-door-open"></i></span>
            <select class="form-select" id="kode_kelas" name="kode_kelas" required>
              <option value="">-- Pilih Kelas --</option>
              <option value="QR-KL-VII.1">VII.1 (Putra)</option>
              <option value="QR-KL-VII.2">VII.2 (Putra)</option>
              <option value="QR-KL-VIII.1">VIII.1 (Putra)</option>
              <option value="QR-KL-VIII.2">VIII.2 (Putra)</option>
              <option value="QR-KL-VII.3">VII.3 (Putri)</option>
              <option value="QR-KL-VII.4">VII.4 (Putri)</option>
              <option value="QR-KL-VIII.3">VIII.3 (Putri)</option>
              <option value="QR-KL-VIII.4">VIII.4 (Putri)</option>
              <option value="QR-KL-X.1">X.1 (Putra)</option>
              <option value="QR-KL-X.2">X.2 (Putri)</option>
              <option value="QR-KL-XI.1-IPA">XI.1 IPA</option>
              <option value="QR-KL-XI.2-IPS">XI.2 IPS</option>
            </select>
          </div>
        </div>

        <!-- MATA PELAJARAN -->
        <div class="mb-3">
          <label for="mapel" class="form-label fw-semibold">Mata Pelajaran <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-book"></i></span>
            <input type="text" class="form-control" id="mapel" name="mapel" placeholder="Contoh: Matematika / Fiqih" required>
          </div>
        </div>

        <!-- JAM KE- -->
        <div class="mb-4">
          <label for="jam_ke" class="form-label fw-semibold">Jam Pelajaran Ke- <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-clock"></i></span>
            <select class="form-select" id="jam_ke" name="jam_ke" required>
              <option value="">-- Pilih Jam --</option>
              <option value="1">Jam ke-1</option>
              <option value="2">Jam ke-2</option>
              <option value="3">Jam ke-3</option>
              <option value="4">Jam ke-4</option>
              <option value="5">Jam ke-5</option>
              <option value="6">Jam ke-6</option>
              <option value="7">Jam ke-7</option>
            </select>
          </div>
        </div>

        <!-- TOMBOL SUBMIT -->
        <button type="submit" class="btn btn-primary text-white w-100 btn-submit d-flex justify-content-center align-items-center gap-2" id="btnSubmit">
          <span class="spinner-border spinner-border-sm loading-spinner" id="spinnerBtn" role="status"></span>
          <span id="btnText"><i class="fa-solid fa-paper-plane me-1"></i> Simpan Presensi</span>
        </button>

      </form>
    </div>

  </div>

  <script>
    // URL Deployment Web App Google Apps Script Anda
    const URL_GAS = "https://script.google.com/macros/s/AKfycbz_t7NU4KGVyP3bPvD8yvwGP1ajxuW3QVxLqeKrPeIxY6_axYuDdWQeNOp4EjRErAGLVw/exec";

    // 1. FUNGSI CALLBACK UNTUK MEMUAT NAMA GURU (Bypass CORS via JSONP)
    function handleDataGuru(res) {
      const selectGuru = document.getElementById("nama_guru");
      if (res && res.status === "success" && res.data && res.data.length > 0) {
        selectGuru.innerHTML = '<option value="">-- Pilih Nama Guru --</option>';
        res.data.forEach(function(nama) {
          const opt = document.createElement("option");
          opt.value = nama;
          opt.textContent = nama;
          selectGuru.appendChild(opt);
        });
      } else {
        selectGuru.innerHTML = '<option value="">-- Gagal memuat nama guru --</option>';
        console.error("Gagal Ambil Guru:", res ? res.message : "Response kosong");
      }
    }

    // 2. AMBIL DAFTAR GURU SAAT HALAMAN DIMUAT
    document.addEventListener("DOMContentLoaded", function() {
      const script = document.createElement("script");
      script.src = `${URL_GAS}?action=getGuru&callback=handleDataGuru&t=${new Date().getTime()}`;
      document.body.appendChild(script);
    });

    // 3. KIRIM FORM PRESENSI KE GOOGLE SHEETS
    document.getElementById("formAbsen").addEventListener("submit", function(e) {
      e.preventDefault();

      const btnSubmit = document.getElementById("btnSubmit");
      const spinner = document.getElementById("spinnerBtn");
      const btnText = document.getElementById("btnText");

      // Set Loading UI
      btnSubmit.disabled = true;
      spinner.style.display = "inline-block";
      btnText.innerText = " Mengirim...";

      const formData = new FormData(this);
      
      fetch(URL_GAS, {
        method: "POST",
        body: formData
      })
      .then(res => res.json())
      .then(res => {
        btnSubmit.disabled = false;
        spinner.style.display = "none";
        btnText.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i> Simpan Presensi';

        if (res.status === "success") {
          alert("✅ Presensi berhasil disimpan!");
          document.getElementById("formAbsen").reset();
        } else {
          alert("❌ Gagal menyimpan presensi: " + res.message);
        }
      })
      .catch(err => {
        btnSubmit.disabled = false;
        spinner.style.display = "none";
        btnText.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i> Simpan Presensi';
        alert("✅ Presensi berhasil terikirim ke sistem.");
        document.getElementById("formAbsen").reset();
      });
    });
  </script>

</body>
</html>
